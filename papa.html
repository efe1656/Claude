<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: #1f2937;
    }

    nav h2 {
      margin: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .hero-content {
      max-width: 700px;
    }

    h1 {
      font-size: 55px;
      margin-bottom: 20px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    #message {
      margin-top: 25px;
      font-weight: bold;
      color: #60a5fa;
    }
  </style>
</head>

<body>

  <nav>
    <h2>TestSite</h2>

    <div>
      <a href="#">Start</a>
      <a href="#">Über uns</a>
      <a href="#">Kontakt</a>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>Willkommen auf meiner Website</h1>

      <p>
        Das ist eine einfache moderne Testseite.
        Hier kannst du HTML, CSS und JavaScript ausprobieren.
      </p>

      <button onclick="zeigeNachricht()">
        Jetzt testen
      </button>

      <div id="message"></div>
    </div>
  </section>

  <script>
    function zeigeNachricht() {
      document.getElementById("message").innerText =
        "✅ JavaScript funktioniert!";
    }
  </script>

</body>
</html>
